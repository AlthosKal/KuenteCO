services:

#FRONT DE LA APLICACION
  kuenteco-ui:
    image: yefff/image-frontend-kuenteco-ui:1.0.2
    container_name: KuentecoUi
    ports:
      - "80:80"
    depends_on:
      - kuenteco-app
      - kuenteco-chat
    networks:
      - kuenteco-network
    restart: unless-stopped

# API KUENTECO-APP DEL BACKEND DE LA APLICACION
  kuenteco-app:
    image: yefff/image-backend-kuenteco-app:1.0.2
    container_name: KuentecoApp
    ports:
      - "8080:8080"
    depends_on:
      postgres-master-database:
        condition: service_healthy
      postgres-replica-database:
        condition: service_healthy
    networks:
      - kuenteco-network
    restart: unless-stopped

#BASE DE DATOS POSTGRESQL MAESTRA
  postgres-master-database:
    image: yefff/image-master-kuenteco:1.1.1
    container_name: DatabaseMasterKuenteCO
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kuenteco-network
    restart: unless-stopped

#BASE DE DATOS POSTGRESQL REPLICA
  postgres-replica-database:
    image: yefff/image-slave-kuenteco:1.1.1
    container_name: DatabaseSlaveKuenteCO
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - kuenteco-network
    depends_on:
      postgres-master-database:
        condition: service_healthy
    restart: unless-stopped

# API KUENTECO-CHAT DEL BACKEND DE LA APLICACION
  kuenteco-chat:
    image: yefff/image-backend-kuenteco-chat:1.0.2
    container_name: KuentecoChat
    ports:
      - "7070:7070"
    depends_on:
      mongo-database:
        condition: service_healthy
    networks:
      - kuenteco-network
    restart: unless-stopped

# BASE DE DATOS MONGODB
  mongo-database:
    image: yefff/image-mongo-kuenteco:1.0.0
    container_name: MongoDatabase
    volumes:
      - mongo-kuenteco-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - kuenteco-network
    command: ["mongod", "--bind_ip_all"]
    restart: unless-stopped
volumes:
  postgres-master-data:
  postgres-replica-data:
  mongo-kuenteco-data:
networks:
  kuenteco-network:
    driver: bridge