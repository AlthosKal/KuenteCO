spring:
  # Configuración de base de datos en memoria para tests
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: test
    password: test

  # Configuración JPA para tests
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

  # Desactivar Flyway en tests unitarios
  flyway:
    enabled: false

  # Configuración de logging para tests
  logging:
    level:
      org.kuenteco.backend: DEBUG
      org.springframework.security: DEBUG
      org.hibernate.SQL: DEBUG
      org.hibernate.type.descriptor.sql.BasicBinder: TRACE

  # Cache deshabilitado para tests
  cache:
    type: none

  # Configuración de seguridad para tests
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-only-not-for-production-use
      expiration: 86400000 # 24 hours in milliseconds

# Configuración H2 Console para debugging (solo en tests)
h2:
  console:
    enabled: true
    path: /h2-console

# Test specific configurations
test:
  mock:
    external-apis: true
  data:
    cleanup: true
