jwt:
  secret: ${JWT_SECRET}
  expiration: 86400

spring:
  application:
    name: KuentecoChat

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true
  ai:
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL}
      api-key: ${DEEPSEEK_KEY}
      chat:
        options:
          model: ${DEEPSEEK_MODEL}
          temperature: 0.7

    openai:
      api-key: ${OPENAI_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL}
          temperature: 0.7
  cache:
    type: caffeine
server:
  port: 7070
  error:
    include-stacktrace: never
  servlet:
    context-path: /api/chat

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

http-connector:
  hosts:
    kuenteco-app:
      host: ${KUENTECO_APP_URL}
      endpoints:

        base-timeout:
          readTimeout: 5000
          writeTimeout: 5000
          connectionTimeout: 5000

        budget:
          base-path: "/budget"
          get-budgets: ""
          get-all-budgets-enrollments:
            url: "/enroll"
          get-budget-comparison:
            url: "/report/comparison"
          get-budget-summary:
            url: "/report/summary"

        category:
          base-path: "/category"
          get-categories: ""
          get-all-category-enrollments:
            url: "/enroll"
          get-category-report:
            url: "/report/{categoryId}"
          get-transactions-by-category:
            url: "/report/summary"
          get-business-user-category-enrollments:
            url: "/enroll/user"

        debt:
          base-path: "/debt"
          get-all-debts: ""
          get-debts-by-state:
            url: "/state/{state}"
          get-overdue-debts:
            url: "/overdue"
          get-debts-expiring-in-days:
            url: "/expiring-soon"
          get-total-pending-amount:
            url: "/total-pending"
          get-debt-summary-report:
            url: "report/summary"

        transaction:
          base-path: "/transaction"
          get-transactions: ""
          get-transactions-summary:
            url: "/report/summary"

logging:
  level:
    com.example.back_end.AiProfileChat.connector: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework: INFO