name: KuenteCO
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  hive_flutter: ^1.1.0
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  permission_handler: ^12.0.0+1
  toastification: ^3.0.3
  iconsax: ^0.0.8
  provider: ^6.1.3
  decimal: ^3.0.2
  image_picker: ^1.0.4
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  async: ^2.13.0
  fake_async: ^1.3.3
  leak_tracker: ^10.0.9
  material_color_utilities: ^0.12.0
  vm_service: ^15.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/Background.png
    - assets/img/Brand.jpeg
    - assets/img/Logo.png
    - assets/img/Logo 1.png
    - assets/img/Logo 2.png