name: kuenteco
description: "A new Flutter project."
publish_to: 'none' # Evita publicar el paquete en pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0' # Asegúrate de que sea compatible con tu versión de Flutter

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8  # Iconos de estilo iOS
  http: ^1.1.0
  flutter_dotenv: ^5.1.0
  postgres: ^3.5.4
  shared_preferences: ^2.2.2
  provider: ^6.1.3
  dio: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0  # Lints recomendados para Flutter

dependency_overrides:
  async: ^2.13.0
  fake_async: ^1.3.3
  leak_tracker: ^10.0.9
  material_color_utilities: ^0.12.0
  vm_service: ^15.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/img/Background.png
    - assets/img/Brand.jpeg
    - assets/img/Logo.png
    - assets/img/Logo 1.png
    - assets/img/Logo 2.png